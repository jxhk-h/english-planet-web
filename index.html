<script>
/* 运行时错误兜底：脚本出错时在 <html> 上留痕并由界面提示，不影响正常使用 */
window.__errors = [];
window.addEventListener("error", function (e) {
  window.__errors.push((e.message || "error") + " @" + (e.filename || "").split("/").pop() + ":" + (e.lineno || 0));
  document.documentElement.setAttribute("data-js-error", window.__errors.join(" | "));
});
</script>

  <symbol id="i-mascot" viewBox="0 0 120 120">
    <path d="M60 10 L73.5 45.4 L111.4 47.3 L81.9 71.1 L91.7 107.7 L60 87 L28.3 107.7 L38.1 71.1 L8.6 47.3 L46.5 45.4 Z"

  <symbol id="i-cloud" viewBox="0 0 120 70">
    <path d="M28 62 Q6 62 6 46 Q6 32 22 30 Q24 12 44 12 Q58 12 64 24 Q68 18 78 18 Q96 18 98 34 Q114 36 114 48 Q114 62 96 62 Z"
          fill="#FFFFFF" stroke="#2F2A44" stroke-width="4" stroke-linejoin="round"/>

</svg>

<!-- ============ 开场 3 秒动画 ============ -->
<div id="splash" role="status" aria-label="正在进入英语星球">
  <div class="sp-sky">
    <svg class="sp-cloud c1" viewBox="0 0 120 70"><use href="#i-cloud"/></svg>
    <svg class="sp-cloud c2" viewBox="0 0 120 70"><use href="#i-cloud"/></svg>
    <svg class="sp-cloud c3" viewBox="0 0 120 70"><use href="#i-cloud"/></svg>
    <div class="sp-spark s1">✦</div>
    <div class="sp-spark s2">✦</div>
    <div class="sp-spark s3">✧</div>
    <div class="sp-spark s4">✦</div>
    <div class="sp-rocket">🚀</div>
  </div>

  <div class="sp-stage">
    <svg class="sp-mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#i-mascot"/></svg>
    <div class="sp-letters">
      <span class="sp-letter l1">A</span>
      <span class="sp-letter l2">B</span>
      <span class="sp-letter l3">C</span>
    </div>
    <h1 class="sp-title"><span>英</span><span>语</span><span>星</span><span>球</span></h1>
    <p class="sp-sub">English Planet · 语法 · 单词 · 文章</p>
    <div class="sp-bar"><i></i></div>
  </div>

  <button id="skipSplash" class="sp-skip" type="button">跳过 ›</button>
</div>

<div id="app" class="app">

  <header class="topbar">
    <a class="brand" href="#/home">

      </span>

    <nav class="nav" id="nav">
      <a href="#/home" data-nav="home"><span class="nav-emoji">🏠</span>首页</a>
      <a href="#/grammar" data-nav="grammar"><span class="nav-emoji">📚</span>语法区</a>
      <a href="#/words" data-nav="words"><span class="nav-emoji">🎒</span>单词区</a>

    </nav>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <div class="foot-in">
      <svg class="foot-mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#i-mascot"/></svg>
      <p><b>英语星球 · English Planet</b></p>
      <p class="foot-tip">每天十分钟，语法、单词、文章各走一小步。点击 🔊 可以听发音。</p>
    </div>
  </footer>
